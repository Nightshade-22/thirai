# Release: publish a release on GitHub (Releases > Draft a new release, tag like v0.1.0).
# This builds the Windows server and attaches thirai-windows-x64.exe, thirai-windows-arm64.exe,
# start-usb.bat, start-wifi.bat and SHA256SUMS.txt to that release.
# Only the release event triggers it: publishing from the website also creates the tag, and a second
# trigger on the tag push would run the upload twice and fail on "already exists".
name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.release.tag_name }}

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Build
        working-directory: windows
        run: |
          mkdir -p ../out
          GOOS=windows GOARCH=amd64 go build -trimpath -ldflags "-s -w" -o ../out/thirai-windows-x64.exe .
          GOOS=windows GOARCH=arm64 go build -trimpath -ldflags "-s -w" -o ../out/thirai-windows-arm64.exe .
          cp dist/start-usb.bat dist/start-wifi.bat ../out/
          cd ../out && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt

      - name: Attach the files to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" out/* --repo "$GITHUB_REPOSITORY" --clobber
